name: rqt_smpl_tok

train:
  num_samples: 1024
  n_epochs: 300
  batch_size: 1
  accumulation_steps: 256
  sample_rate: 24000
  learning_rate: 9e-5
  bos_token: 0
  weight_decay: 1e-6
  resume_from_checkpoint: null
  scheduler_on: True
  warmup_on: False
  num_cycles: 0.25 # cosine scheduler

model:
  text_embed_dim: 512
  text_num_layers: 2
  num_decoder_layers: 2
  rq_transformer: False
  whisper_tokenizer: False # if False will use char tokenizer

rvq:
  n_bins: 1024
  n_quantizers: 32

dataset:
  root_dir: "./datasets/cmu_us_awb_arctic"
  wav_dir: "wav"
  text_file: "etc/txt.done.data"

logging:
  log_dir: "runs"
  save_every: 75000
